# docker stack deploy -c stack.yml builder
# Provision the external TLS secrets and run scripts/buildkitd.sh first.
# The panel's network (panelnet) must already exist.
services:
  module:
    image: "${BUILDER_IMAGE:-ghcr.io/modularnost/builder-module:latest}"
    networks: [panelnet, buildnet]
    volumes:
      - builder_data:/data
    secrets:
      - {source: builder_buildkit_ca, target: buildkit-ca.pem, uid: "10001", gid: "10001", mode: 0400}
      - {source: builder_buildkit_client, target: buildkit-client.pem, uid: "10001", gid: "10001", mode: 0400}
      - {source: builder_buildkit_client_key, target: buildkit-client-key.pem, uid: "10001", gid: "10001", mode: 0400}
    environment:
      PANEL_CORE_URL: http://panel:8080
      REGISTRY_PULL: "${REGISTRY_PULL:?Set REGISTRY_PULL to a protected registry endpoint reachable from every Swarm node}"
      # TRAEFIK_ENTRYPOINT: websecure
      # TRAEFIK_RESOLVER: le          # empty serves plain HTTP
    deploy:
      placement:
        constraints: [node.role == manager]
      labels:
        panel.module: "true"
        panel.module.name: builder
        panel.module.version: "0.1.0"

  registry:
    image: registry:3@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
    networks:
      buildnet:
        aliases: [registry]
    volumes:
      - registry_data:/var/lib/registry
    environment:
      REGISTRY_HTTP_TLS_CERTIFICATE: /run/secrets/registry.pem
      REGISTRY_HTTP_TLS_KEY: /run/secrets/registry-key.pem
      REGISTRY_HTTP_TLS_CLIENTCAS: '[/run/secrets/registry-ca.pem]'
      REGISTRY_HTTP_RELATIVEURLS: "true"
    secrets:
      - {source: builder_registry_cert, target: registry.pem, mode: 0400}
      - {source: builder_registry_key, target: registry-key.pem, mode: 0400}
      - {source: builder_registry_ca, target: registry-ca.pem, mode: 0400}
    deploy:
      placement:
        constraints: [node.role == manager]

networks:
  panelnet:
    external: true
  buildnet:
    external: true

volumes:
  builder_data:
  registry_data:

secrets:
  builder_buildkit_ca: {external: true}
  builder_buildkit_client: {external: true}
  builder_buildkit_client_key: {external: true}
  builder_registry_cert: {external: true}
  builder_registry_key: {external: true}
  builder_registry_ca: {external: true}
